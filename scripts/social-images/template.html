<!doctype html>
<!--
  Link preview images (og:image / twitter:image), rendered by generate.sh with headless Chrome.
  Query string: ?lang=en|fr&format=og|x|square. Texts mirror site.badge / site.tagline in src/i18n/ui.ts.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Figtree";
    font-weight: 300 900;
    src: url("../../src/assets/fonts/figtree-variable.woff2") format("woff2");
  }
  :root {
    --accent: #e3b607;
    --bg: #15130d;
    --text: #f2f0e8;
    --muted: #b5b0a1;
  }
  * { box-sizing: border-box; }
  body, p, h1 { margin: 0; }
  /* generate.sh renders a window 200px taller (headless Chrome's viewport is shorter than its window)
     and keeps the centre: the image is the body, with a 100px margin above and below */
  html { height: calc(var(--h) + 200px); overflow: hidden; background: var(--bg); }
  body { width: var(--w); height: var(--h); margin-top: 100px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(circle at 100% 100%, rgba(227, 182, 7, .2), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Figtree", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .og { --w: 1200px; --h: 630px; }
  .x { --w: 1200px; --h: 675px; }
  .square { --w: 1200px; --h: 1200px; }

  .content {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 80px;
  }
  .brand { display: flex; align-items: center; gap: 24px; }
  .logo { width: 88px; height: 88px; flex: none; }
  .badge {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--muted);
  }
  h1 {
    margin-top: 36px;
    font-size: 128px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.035em;
    white-space: nowrap;
  }
  h1 .four { color: var(--accent); padding: 0 .16em; }
  .tagline {
    margin-top: 32px;
    max-width: 21em;
    font-size: 44px;
    font-weight: 500;
    line-height: 1.22;
    text-wrap: balance;
  }
  .url {
    position: absolute;
    right: 80px;
    bottom: 56px;
    font-size: 30px;
    font-weight: 700;
    color: var(--accent);
  }

  /* Square: bigger type, the name on two lines */
  .square .content { justify-content: flex-start; padding: 120px 100px 0; }
  .square .logo { width: 128px; height: 128px; }
  .square .badge { font-size: 38px; }
  .square h1 { margin-top: 48px; font-size: 190px; line-height: .98; }
  .square h1 .line { display: block; }
  .square .tagline { margin-top: 44px; max-width: 14em; font-size: 64px; }
  .square .url { right: auto; left: 100px; bottom: 96px; font-size: 42px; }
</style>
</head>
<body>
  <div class="content">
    <div class="brand">
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="48" fill="#e3b607"/>
        <path fill="#1f1c14" d="M92.1 343.8V205.3H41V168.2H183.5V205.3H132.3V343.8ZM354.6 343.8V168.2H471V205.3H395V239.2H456.5V276.1H395V343.8Z"/>
        <path fill="#5e4802" d="M268.8 343.8V313H186.7V280.6L263.5 168.2H306.9V278.6H335V313H306.9V343.8ZM227.1 278.6H268.8V217.6Z"/>
      </svg>
      <p class="badge" data-t="badge"></p>
    </div>
    <h1><span class="line">Tech<span class="four">4</span></span><span class="line">Fertility</span></h1>
    <p class="tagline" data-t="tagline"></p>
  </div>
  <p class="url">tech4fertility.org</p>

  <script>
    const params = new URLSearchParams(location.search);
    const lang = params.get('lang') === 'fr' ? 'fr' : 'en';
    const format = ['og', 'x', 'square'].includes(params.get('format')) ? params.get('format') : 'og';
    document.documentElement.lang = lang;
    document.documentElement.className = format;

    const texts = {
      en: {
        badge: 'Non-profit association',
        tagline: 'Putting technology to work for natural family planning.',
      },
      fr: {
        badge: 'Association à but non lucratif',
        tagline: 'La technologie au service des méthodes naturelles de régulation des naissances.',
      },
    };
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = texts[lang][el.dataset.t]; });
    // "Tech 4 Fertility" on one line in landscape formats
    if (format !== 'square') document.querySelector('h1 .four').style.paddingRight = '.3em';
  </script>
</body>
</html>
