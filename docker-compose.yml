# Node/Astro toolchain runs entirely in Docker: nothing to install on the host.
#
#   docker compose up dev                  → dev server on http://localhost:4321/fr
#   docker compose run --rm build          → static build into ./dist
#   docker compose up preview              → builds then serves ./dist on http://localhost:4322/fr
#   docker compose run --rm dev npm <cmd>  → any other npm command (install, check…)

x-node: &node
  image: node:22-alpine
  working_dir: /app
  volumes:
    - .:/app
    # node_modules lives in a Docker volume (Linux binaries, keeps the host clean)
    - node_modules:/app/node_modules
  environment:
    ASTRO_TELEMETRY_DISABLED: "1"
    # Reliable file-change detection on volumes mounted from macOS
    CHOKIDAR_USEPOLLING: "true"

services:
  dev:
    <<: *node
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4321"
    ports:
      - "4321:4321"

  build:
    <<: *node
    command: sh -c "npm ci && npm run build"
    profiles: [tools]

  preview:
    <<: *node
    command: sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 4322"
    ports:
      - "4322:4322"
    profiles: [tools]

volumes:
  node_modules:
